# Local Alpaca Paper only. External submission remains disabled by default.
environment: paper
broker: alpaca_paper
base_url: https://paper-api.alpaca.markets
trading_enabled: false
symbols: [BTC/USD]
trigger: manual
# Authorized automation requires scheduled, explicit auto-enable, and --execute-paper.
database_path: runtime/trading.sqlite
request_timeout_seconds: 15
market_data_source: alpaca_crypto_us_orderbook
fresh_market_wait_seconds: 0
