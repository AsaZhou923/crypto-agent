# Copy to a private configuration directory as strategy.yaml.
# Minute bars and targets are Paper experiment parameters, not investment advice.
name: intraday_ai
upstream_repository: ../TradingAgents
upstream_commit: 2d17df8da1536c121e4d7395ac5a5dcec9e96d6f
analysis_symbol: BTC-USD
asset_type: crypto
llm_provider: openai
backend_url: null
deep_think_llm: your-model-id
quick_think_llm: your-model-id
selected_analysts: [market]
max_debate_rounds: 1
max_risk_discuss_rounds: 1
output_language: Chinese
decision_profile: intraday_10m
timeout_seconds: 60
decision_ttl_seconds: 240
intraday_lookback_bars: 60
intraday_min_bars: 45
intraday_max_bar_age_seconds: 180
intraday_momentum_threshold_bps: 2
intraday_entry_score: 2
intraday_entry_policy: capped_probe
intraday_probe_max_position_usd: 10
intraday_probe_cost_budget_usd: 0.15
rating_target_pct: {Buy: 0.0005, Overweight: 0.0003, Underweight: 0.0001, Sell: 0}
baseline_buy_below_usd: 60000
baseline_target_pct: 0.001
